[project]
name = "migrate-antigravity"
version = "1.0.0"
description = "Antigravity Kit -> Kiro migration tool"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
# Coverage gate (>=80%) plus the standard test discovery roots.
addopts = "--cov=migrate_antigravity --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["migrate_antigravity"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.hypothesis]
# Each property test runs at least 100 examples (per design.md / tasks.md).
max_examples = 100
